<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12080c">
<title>暗渊回廊 · 文字暗黑</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar">
  <div class="tb-left">
    <div class="game-title">暗渊回廊</div>
    <div class="tb-day">🔥 元素使 · 文字暗黑</div>
  </div>
  <div id="tb-res" class="tb-res"></div>
</header>

<div id="layout">
  <main id="left">
    <nav id="tabs">
      <button class="tab active" data-tab="maps">🗺️出征</button>
      <button class="tab" data-tab="hub">🏪主城</button>
      <button class="tab" data-tab="craft">⚒️打造</button>
      <button class="tab" data-tab="talents">🌳天赋</button>
      <button class="tab" data-tab="log">📜记录</button>
    </nav>
    <section id="panel-maps" class="panel active"></section>
    <section id="panel-hub" class="panel"></section>
    <section id="panel-craft" class="panel"></section>
    <section id="panel-talents" class="panel"></section>
    <section id="panel-log" class="panel"><div id="log-list"></div></section>
  </main>

  <aside id="side">
    <h2 class="sec">装备</h2>
    <div id="side-equip"></div>
    <h2 class="sec">属性</h2>
    <div id="side-stats"></div>
    <h2 class="sec">背包</h2>
    <div id="side-bag"></div>
  </aside>
</div>

<div id="battle" class="bwrap hidden">
  <div class="bwrap-box">
    <h2 id="battle-title">⚔️ 战斗</h2>
    <div id="bmobs" class="bmobs"></div>
    <div id="blog" class="blog"></div>
    <div id="bplayer"></div>
    <div id="bactions"></div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="ev-title"></h2>
    <p id="ev-text"></p>
    <div id="ev-choices"></div>
  </div>
</div>

<div id="overlay" class="overlay hidden">
  <div class="overlay-box" id="overlay-content"></div>
</div>

<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/extend.js"></script>
<script src="js/game.js"></script>
<script src="js/p12.js"></script>
</body>
</html>
